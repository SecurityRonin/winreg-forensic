[package]
name = "winreg-cli"
version = "0.2.0"
description = "Windows Registry forensic CLI (reg4n6)"
# Binary distributed via release.yml (GitHub Release + Homebrew/apt/winget on a
# v[0-9]* tag), not crates.io — release-plz must not publish it.
publish = false
authors = ["Albert Hui <albert@securityronin.com>"]
edition.workspace = true
# NOT the workspace floor. The workspace declares 1.75 because seven PUBLISHED
# libraries here promise it to downstreams. This crate is `publish = false` -- a
# binary distributed by tag -- so nothing pins against it and it has no such
# promise to keep. It cannot keep one either: clap 4.6 requires edition2024,
# which needs cargo 1.85+. Per fleet policy an app declares the pinned toolchain.
rust-version = "1.96.0"
license.workspace = true
repository.workspace = true

[[bin]]
name = "reg4n6"
path = "src/main.rs"

[dependencies]
winreg-core.workspace = true
winreg-diff.workspace = true
winreg-discover.workspace = true
winreg-format.workspace = true
jiff.workspace = true
clap.workspace = true
serde_json.workspace = true

[lints]
workspace = true
