[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `winreg-testutil` is publish = false, version 0.0.0, and appears only in
# dev-dependencies as a path dep -- so it has no version to pin and cargo strips
# it when packaging a dependent. That is a wildcard by construction, not an
# unpinned third-party dependency.
#
# This setting permits wildcards ONLY for path dependencies on private crates,
# which is narrower than `wildcards = "allow"`: a genuine unpinned dependency on
# a published crate still fails.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
