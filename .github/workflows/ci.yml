name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@fefad0f1e71a5206e5258bc56b9147ae9d4cba73
    with:
      # MSRV is NOT overridden. Every member declares a floor and the shared
      # workflow verifies each at its own -- which matters here, because
      # winreg-carve declares 1.80 while the workspace declares 1.75. The old
      # single-toolchain job built only two of the eight published crates.
      #
      # Coverage is a FLOOR, measured rather than aspirational: LINE coverage is
      # 86.31% with binaries excluded, at the time of migration. Taken from
      # `cargo llvm-cov --json` rather than the summary table, because the first
      # percentage column there is REGIONS (87.23%) and the gate compares lines
      # -- reading the wrong column set this floor above what the repo meets and
      # failed the first run.
      coverage-gate: floor
      coverage-floor: 86
      coverage-ignore-regex: '(^|/)src/(main\.rs|bin/)'
      # ubuntu-only for now. The old CI was ubuntu-only too, and proving the
      # Windows and macOS legs is a separate change with its own failures.
      os-matrix: false
